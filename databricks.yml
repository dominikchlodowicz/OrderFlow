bundle:
  name: orderflow
  databricks_cli_version: ">=0.245.0"

include:
  - resources/*.yml

variables:
  cluster_policy_id:
    description: Compute policy used by OrderFlow Lakeflow Jobs
    lookup:
      cluster_policy: orderflow-job-policy

artifacts:
  orderflow_wheel:
    type: whl
    path: .
    build: python -m build --wheel
    dynamic_version: true

sync:
  exclude:
    - artifacts/**
    - build/**
    - data/**
    - dev/**
    - dist/**
    - scripts/**
    - src/**
    - tests/**
    - typings/**
    - "*.duckdb"
    - "*.duckdb.wal"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.egg-info/**"

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://adb-7405608961291895.15.azuredatabricks.net
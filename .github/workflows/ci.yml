name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify formatting
        run: black --check src tests scripts

      - name: Lint Python
        run: ruff check src tests scripts

      - name: Run targeted data-quality tests
        run: python -m pytest tests/quality -q

      - name: Run complete pytest suite
        run: python -m pytest -q

      - name: Build Python wheel
        run: python -m build --wheel

      - name: Upload Python wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orderflow-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  bundle-validation:
    name: Databricks bundle validation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@602f285bac0c85e5985bf4c16d5a2befed0578d9 # v1.14.1

      - name: Check required Databricks configuration
        shell: bash
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_cluster_policy_id: ${{ vars.DATABRICKS_CLUSTER_POLICY_ID }}
        run: |
          missing=()
          for name in DATABRICKS_HOST DATABRICKS_TOKEN BUNDLE_VAR_cluster_policy_id; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub configuration: ${missing[*]}"
            exit 1
          fi

      - name: Validate development bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          BUNDLE_VAR_cluster_policy_id: ${{ vars.DATABRICKS_CLUSTER_POLICY_ID }}
        run: databricks bundle validate -t dev

  airflow-validation:
    name: Airflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Astro CLI
        uses: astronomer/setup-astro-cli@d8de1c738a79b83c057d185202557c894e33d2f7 # v0.0.1
        with:
          version: "1.45.0"

      - name: Configure harmless DAG parse environment
        working-directory: airflow
        run: printf '%s\n' 'ORDERFLOW_JOB_ID=1' > .env

      - name: Parse Airflow DAGs
        working-directory: airflow
        run: astro dev parse

      - name: Run Airflow tests
        working-directory: airflow
        run: astro dev pytest
